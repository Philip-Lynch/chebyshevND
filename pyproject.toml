[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ChebyshevND"
version = "0.1.1"
description = "Fast multidimensional Chebyshev interpolation using DCTs, Clenshaw recursions, and coefficient pruning"
authors = [{ name = "Philip Lynch", email = "philip.lynch@aei.mpg.de" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "chebyshev",
    "interpolation",
    "approximation",
    "spectral-methods",
    "clenshaw",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy",
    "scipy",
    "numba",
]

[project.urls]
Repository = "https://github.com/Philip-Lynch/chebyshevND"
Documentation = "https://chebyshevnd.readthedocs.io"
Issues = "https://github.com/Philip-Lynch/chebyshevND/issues"

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx", "furo", "myst-nb"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
