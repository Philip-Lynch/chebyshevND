[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ChebyshevND"
version = "0.1.0"
description = "Multidimensional Chebyshev interpolation"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "numba",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx", "furo", "myst-nb"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]